spring.application.name=REGINOTES
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true


spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

minio.endpoint=${MINIO_ENDPOINT}
minio.user=${MINIO_USER}
minio.password=${MINIO_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION}

minio.buckets.notes=${MINIO_NOTE_BUCKET}
minio.buckets.profile=${MINIO_USER_BUCKET}

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

springdoc.packagesToScan=LNASC.REGINOTES
springdoc.pathsToMatch=/**

# nível geral
logging.level.root=INFO

# logs do hibernate — mostra as queries executadas
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# logs do spring security
logging.level.org.springframework.security=DEBUG

# logs da sua aplicação
logging.level.com.seupacote=DEBUG

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USER}
spring.mail.password=${MAILTRAP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=10MB




